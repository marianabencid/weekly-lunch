<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almuerzos</title>
<meta name="theme-color" content="#F3EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
<meta name="description" content="Planificador de almuerzos de la semana para Maurilyn, Harmodio y Mariana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almuerzos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE6;--surface:#FFFDF9;--surface2:#F7F2EA;--ink:#2B2823;--muted:#7B7368;--line:#E4DBCD;
  --plate:#FFFFFF;--rim:#EAE2D5;--track:#ECE5DA;--warn:#C0563A;--accent:#D9832E;
  --f-med:#6E9A5B;--f-carne:#C8674A;--f-pollo:#DE9F2C;--f-asia:#9A5FA8;--f-mar:#2E95A8;
  --mama:#A9492D;--nos:#DE916A;--sage:#8FA586;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif",Georgia,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1A18;--surface:#252320;--surface2:#2C2A26;--ink:#EDE7DD;--muted:#A39C91;--line:#3B3833;
  --plate:#34312C;--rim:#433F39;--track:#383530;--warn:#E48A6C;--accent:#E9A15A;
  --f-med:#8BB577;--f-carne:#DA8367;--f-pollo:#E9B550;--f-asia:#B784C4;--f-mar:#52B3C4;--mama:#D2694B;--nos:#EDB392;--sage:#8FAE82;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1B1A18;--surface:#252320;--surface2:#2C2A26;--ink:#EDE7DD;--muted:#A39C91;--line:#3B3833;
  --plate:#34312C;--rim:#433F39;--track:#383530;--warn:#E48A6C;--accent:#E9A15A;
  --f-med:#8BB577;--f-carne:#DA8367;--f-pollo:#E9B550;--f-asia:#B784C4;--f-mar:#52B3C4;--mama:#D2694B;--nos:#EDB392;--sage:#8FAE82;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:.01em}
.tint{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:color-mix(in srgb,var(--c) 38%,var(--line))}

/* Header */
.top{max-width:1120px;margin:0 auto;padding:22px 20px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:none}
.brand h1{font-size:32px;line-height:1;font-weight:800}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.noren{max-width:1080px;margin:14px auto 0;display:flex;gap:6px;padding:0 20px}
.noren i{flex:1;height:5px;border-radius:0 0 6px 6px;background:var(--sage)}
.nav{margin-left:auto;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:none;padding:7px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
main{max-width:1120px;margin:0 auto;padding:18px 20px 110px}

/* Generic */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.color{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar{height:7px;border-radius:7px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .35s}
.who-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
button.who-chip{cursor:pointer}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--c,var(--accent));flex:none;cursor:pointer}
.check .t{flex:1;min-width:0}
.check .ttl{border:0;background:none;padding:0;text-align:left;font-weight:500;text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,var(--ink) 28%,transparent);text-decoration-thickness:1px;text-underline-offset:4px}
.check .ttl:hover{color:color-mix(in srgb,var(--c,var(--accent)) 70%,var(--ink))}
.check.done .ttl,.check.done .plain{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.check .own{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0 2px 6px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
.odot{width:.75em;height:.75em;border-radius:50%;display:inline-block;flex:none}
.legend-dots{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 4px}
.legend-dots span{display:inline-flex;align-items:center;gap:6px}
.cardwrap{position:relative;display:flex}
.cardwrap .card{flex:1}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 80%,transparent);display:grid;place-items:center;color:var(--muted)}
.heart svg{width:16px;height:16px}
.heart[aria-pressed="true"]{color:var(--mama)}
.heart.big{position:static;width:38px;height:38px;border:1px solid var(--line)}
.portions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface2)}
.stepper b{min-width:34px;text-align:center}
.task-ed{border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-top:10px;background:var(--surface2)}
.task-ed .g3{grid-template-columns:2fr 1fr 1fr}
.task-ed textarea{min-height:90px;background:var(--surface)}
.task-ed input,.task-ed select{background:var(--surface)}
.check .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.check .m{font-size:12px;color:var(--muted);white-space:nowrap}
.label-sm{font-size:12px;color:var(--muted);font-weight:700;margin:16px 0 2px}

/* Week */
.hero{border-radius:22px;padding:20px 22px;margin-bottom:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--f-pollo) 22%,var(--surface)),color-mix(in srgb,var(--f-mar) 16%,var(--surface)) 60%,color-mix(in srgb,var(--f-asia) 14%,var(--surface)));border:1px solid var(--line)}
.hero .row{justify-content:space-between}
.hero h2{font-size:26px}
.prots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.prot{font-size:13px;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--surface);border:1px solid var(--line)}
.prot .dot{margin-right:6px}
.month{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px}
.mpill{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 75%,transparent);border-radius:14px;padding:8px 12px;min-width:124px;text-align:left}
.mpill[aria-current="true"]{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mpill b{display:block;font-size:13px}
.mpill .bar{margin-top:6px;height:4px}
.mpill span{font-size:11px;color:var(--muted)}
.summary{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:16px}
.balance .bb{display:flex;height:12px;border-radius:12px;overflow:hidden;background:var(--track);margin:12px 0 8px;gap:2px}
.balance .legend{display:flex;justify-content:space-between;font-size:13px;gap:10px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.day{--c:var(--fam);position:relative;text-align:left;border:1px solid;border-radius:18px;padding:16px 14px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:268px}
.day::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--fam)}
.day .dow{font-family:var(--serif);font-size:18px;font-weight:800}
.day .date{font-size:12px;color:var(--muted)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day .art{width:100px;height:100px;margin:2px auto;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--fam) 30%,transparent))}
.day .name{font-weight:700;font-size:14px;line-height:1.3;min-height:36px}
.day .prog{margin-top:auto}
.day .prog .row{justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.day.empty{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--muted)}
.day.empty::before{display:none}
.day.empty .plus{font-family:var(--serif);font-size:32px;line-height:1;color:var(--accent)}
.alert{font-size:12px;color:var(--warn)}

/* Library */
.lib-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.intro{color:var(--muted);font-size:14px;max-width:70ch;margin:10px 0 22px}
.pickbar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid var(--accent);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.fam{margin-bottom:30px}
.fam-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--fam) 16%,var(--surface))}
.fam-head h3{font-size:20px;display:flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--fam) 70%,var(--ink))}
.fam-head .sh{font-size:13px;color:var(--muted)}
.fam-head .inweek{font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:2px 10px;background:var(--fam);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.card{--c:var(--fam);border:1px solid;border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.card .art{width:100%;aspect-ratio:1;max-width:132px;margin:0 auto 4px}
.card .nm{font-weight:700;font-size:14px;line-height:1.3}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.diff{display:inline-flex;gap:2px}.diff i{width:5px;height:5px;border-radius:50%;background:var(--line)}.diff i.on{background:var(--ink)}
.tag{font-size:11px;border-radius:6px;padding:0 6px;background:var(--surface);color:var(--muted)}
.art svg,.art img{width:100%;height:100%;display:block}
.art img{object-fit:cover;border-radius:50%}

/* Modal */
.wrap{position:fixed;inset:0;background:rgba(20,19,17,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;max-width:780px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:22px;position:relative}
.sheet-top{height:8px;margin:-22px -22px 18px;background:var(--fam,var(--accent))}
.sheet .x{position:absolute;right:14px;top:20px}
.rec-head{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
.rec-head .art{width:180px;height:180px}
.rec-head h2{font-size:26px;line-height:1.2;margin-bottom:6px;padding-right:40px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}
.nutri div{border-radius:14px;padding:10px;text-align:center}
.nutri b{display:block;font-family:var(--serif);font-size:22px}
.nutri span{font-size:11px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;margin-top:14px}
.cols h3{font-size:16px;margin-bottom:6px}
.ing{list-style:none;padding:0;margin:0}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.ing li span:last-child{color:var(--muted);white-space:nowrap}
details.comp{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
details.comp summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:500;font-size:14px}
details.comp ol{margin:8px 0 2px;padding-left:20px;font-size:14px}
details.comp li{margin-bottom:4px}
.stepnum{counter-reset:s;list-style:none;padding:0;margin:14px 0 0}
.stepnum li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.55}
.stepnum li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;background:color-mix(in srgb,var(--fam) 22%,var(--surface));color:color-mix(in srgb,var(--fam) 70%,var(--ink))}
.callout{border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px;background:color-mix(in srgb,var(--fam) 13%,var(--surface))}
.actions{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:13px;min-width:54px}
.daychips button.busy{color:var(--muted)}
.form label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px}
.form textarea{min-height:110px;font-size:13px;line-height:1.5}
.form .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.preview{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-top:8px}

/* Shopping + cooking */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.sec-title{font-family:var(--serif);font-size:18px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.shopsec{--c:var(--sc)}
.shopsec .sec-title .dot{width:11px;height:11px;background:var(--sc)}
.shopsec .days-used{font-size:12px;color:var(--muted);margin-left:4px;white-space:nowrap}
.check.done .plain{text-decoration-line:line-through}
.daytask{margin-top:14px;padding:12px 14px;border-radius:14px;--c:var(--fam)}
.daytask .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daytask .hd b{font-family:var(--serif);font-size:17px}
.split{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.frz{display:flex;align-items:center;gap:12px;margin-top:10px}
.frz b{font-family:var(--serif);font-size:32px;min-width:40px;text-align:center;color:var(--f-mar)}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}

@media (max-width:900px){
  .days{grid-template-columns:1fr}
  .day{min-height:0;display:grid;grid-template-columns:78px 1fr;grid-template-areas:"art head" "art name" "art who" "prog prog";column-gap:14px;row-gap:2px;padding-top:18px}
  .day .art{grid-area:art;width:78px;height:78px;margin:0}
  .day .hd{grid-area:head}.day .name{grid-area:name;min-height:0}.day .who{grid-area:who}.day .prog{grid-area:prog;margin-top:8px}
  .day.empty{display:flex;flex-direction:row;gap:12px;justify-content:flex-start;padding:14px}
  .summary,.two,.cols{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top{padding:14px 16px 0}
  .brand h1{font-size:27px}
  .noren{padding:0 16px}
  main{padding:14px 16px 110px}
  .nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;justify-content:space-between;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.14)}
  .nav button{flex:1;padding:10px 4px;font-size:13px}
  .top .icon-btn{margin-left:auto}
  .wrap{align-items:flex-end;padding:0}
  .sheet{border-radius:22px 22px 0 0;max-height:92%;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
  .sheet-top{margin:-18px -16px 16px}
  .rec-head{grid-template-columns:1fr}
  .rec-head .art{width:150px;height:150px;margin:0 auto}
  .nutri{grid-template-columns:repeat(2,1fr)}
  .form .g4,.form .g3{grid-template-columns:1fr 1fr}
  .hero h2{font-size:22px}
}
@media (max-width:640px){
  .days{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .days::-webkit-scrollbar{display:none}
  .day,.day.empty{flex:0 0 84%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:10px;aspect-ratio:3/4.1;min-height:0;padding:22px 20px 18px}
  .day .hd{display:flex;align-items:baseline;justify-content:space-between}
  .day .dow{font-size:24px}
  .day .date{font-size:13px}
  .day .art{width:62%;height:auto;aspect-ratio:1;margin:6px auto 4px}
  .day .name{font-size:18px;min-height:0;font-family:var(--serif);font-weight:800}
  .day .prog{margin-top:auto}
  .day .prog .bar{height:9px}
  .day.empty{justify-content:center;align-items:center;text-align:center;gap:8px}
  .day.empty .plus{font-size:48px}
  .pager{display:flex;justify-content:center;gap:6px;margin-top:12px}
